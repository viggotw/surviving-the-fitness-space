<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>surviving-the-fitness-space</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0a0a0c;
        overflow: hidden;
      }
      #scene {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #controls {
        position: absolute;
        top: 0;
        right: 0;
      }
      #overlay {
        position: absolute;
        bottom: 1.5rem;
        left: 1.5rem;
        color: #e8e8ea;
        font-family: system-ui, sans-serif;
        font-size: 0.9rem;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="controls"></div>
    <div id="overlay"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
