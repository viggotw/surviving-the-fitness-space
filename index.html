<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>surviving-the-fitness-space</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0a0a0c;
        overflow: hidden;
      }
      #scene {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #controls {
        position: absolute;
        top: 0;
        right: 0;
      }
      #overlay {
        position: absolute;
        bottom: 1.5rem;
        left: 1.5rem;
        color: #e8e8ea;
        font-family: system-ui, sans-serif;
        font-size: 0.9rem;
        pointer-events: none;
      }
      #stats {
        position: absolute;
        top: 1rem;
        left: 0;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.35rem;
        color: #e8e8ea;
        font-family: system-ui, sans-serif;
        text-align: center;
        pointer-events: none;
      }
      #stats .stats-counters {
        font-size: 0.85rem;
        letter-spacing: 0.02em;
        opacity: 0.85;
        white-space: pre;
      }
      #stats .stats-prompt {
        margin-top: 0.75rem;
        max-width: 90vw;
        font-size: clamp(2.5rem, 7vw, 6rem);
        font-weight: 200;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #d8f3f0;
        text-shadow:
          0 0 40px rgba(120, 220, 210, 0.55),
          0 0 90px rgba(80, 180, 190, 0.35);
        opacity: 0;
        filter: blur(18px);
        /* transition is set from StatsHud.ts, in lockstep with PROMPT_FADE_DURATION_SECONDS/PROMPT_MIST_BLUR_PX there */
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="controls"></div>
    <div id="overlay"></div>
    <div id="stats"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
